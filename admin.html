<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>コンシェルジュ 運用管理パネル</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --color-main: #6e5340;
    --color-bg: #f9f8f6;
    --color-surface: #ffffff;
    --color-text: #2b2520;
    --color-line: #eae4db;
    --radius: 12px;
  }
  body {
    margin: 0;
    padding: 40px 20px;
    font-family: "Zen Kaku Gothic New", sans-serif;
    background: var(--color-bg);
    color: var(--color-text);
  }
  .wrap { max-width: 720px; margin: 0 auto; background: var(--color-surface); border: 1px solid var(--color-line); border-radius: var(--radius); padding: 36px; box-shadow: 0 10px 30px rgba(43, 37, 32, 0.03); }
  h1 { margin-top: 0; font-size: 20px; border-bottom: 1px solid var(--color-line); padding-bottom: 16px; letter-spacing: 0.04em; }
  .section { margin-top: 28px; }
  .section h2 { font-size: 14px; color: var(--color-main); margin-bottom: 14px; letter-spacing: 0.04em; }
  .field { display: grid; gap: 8px; margin-bottom: 18px; font-size: 13px; font-weight: 500; }
  input[type="text"], input[type="url"], select, textarea { width: 100%; padding: 12px 14px; border: 1px solid var(--color-line); border-radius: 8px; background: #faf8f5; font-size: 14px; box-sizing: border-box; outline: none; }
  input[type="color"] { width: 60px; height: 40px; border: 1px solid var(--color-line); border-radius: 8px; padding: 2px; background: #faf8f5; cursor: pointer; }
  .btn { background: var(--color-main); color: #fff; border: none; padding: 14px 24px; font-size: 14px; border-radius: var(--radius); cursor: pointer; font-weight: 500; letter-spacing: 0.06em; width: 100%; transition: opacity 0.2s; }
  .btn:hover { opacity: 0.9; }
  .note { font-size: 11px; color: #8c8278; line-height: 1.6; margin-top: 4px; }
</style>
</head>
<body>
  <div class="wrap">
    <h1>コンシェルジュ 運用管理パネル</h1>
    <p class="note">設定はブラウザのlocalStorageに保存され、お客様画面へ即時反映されます。</p>

    <div class="section">
      <h2>1. ブランド・基本設定</h2>
      <label class="field">ブランド名
        <input type="text" id="brandName" value="DAYSART -Classic-">
      </label>
      <label class="field">ブランドロゴ画像 URL (PNG等)
        <input type="url" id="logoUrl" placeholder="https://...">
      </label>
      <label class="field">ロゴのカラーフィルター
        <select id="logoFilter">
          <option value="none">元の画像のまま（カラー無加工）</option>
          <option value="sepia">セピア・アンティーク調に馴染ませる</option>
          <option value="dark">シックなダークトーンにする</option>
          <option value="monochrome">モノトーンにする</option>
        </select>
      </label>
      <label class="field">キャッチコピー
        <input type="text" id="tagline" value="革と対話するコンシェルジュ">
      </label>
      <label class="field">最初の挨拶メッセージ（目的を尋ねる言葉）
        <input type="text" id="greeting" value="ようこそ。革の表情から、今日の一品を一緒に見つけましょう。まずは、お探しもののご用途を教えてください。">
      </label>
      <label class="field">メインカラー
        <input type="color" id="mainColor" value="#6e5340">
      </label>
    </div>

    <div class="section">
      <h2>2. Shopify同期・キーワード設定</h2>
      <label class="field">Shopify ストア URL
        <input type="url" id="shopifyDomain" placeholder="https://daysart-classic.com">
      </label>
      <label class="field">カテゴリ判定キーワード（バッグ用：カンマ区切り）
        <input type="text" id="bagKeywords" value="バッグ, トート, リュック, ブリーフ, ショルダー, ボストン, ボディバッグ">
      </label>
      <label class="field">カテゴリ判定キーワード（財布・小物用：カンマ区切り）
        <input type="text" id="walletKeywords" value="財布, ウォレット, キーケース, カードケース, コイン, 名刺入れ, カバー">
      </label>
    </div>

    <div class="section">
      <h2>3. 予算（価格帯）設定</h2>
      <label class="field">低価格帯の上限（円）
        <input type="text" id="budgetLow" value="30000">
      </label>
      <label class="field">中価格帯の上限（円）
        <input type="text" id="budgetMid" value="80000">
      </label>
    </div>

    <button class="btn" id="saveBtn" type="button">設定を保存する</button>
    <p id="statusMsg" style="margin-top: 12px; font-size: 12px; color: #4a7c59; text-align: center; font-weight: 500;"></p>

    <div class="section" style="margin-top: 32px; border-top: 1px solid var(--color-line); padding-top: 20px;">
      <a href="index.html" target="_blank" style="color: var(--color-main); font-weight: 500; text-decoration: none; font-size: 13px;">→ お客様用画面（index.html）を確認する</a>
    </div>
  </div>

<script>
  const saved = JSON.parse(localStorage.getItem("concierge_config") || "{}");
  if (saved.brandName) document.getElementById("brandName").value = saved.brandName;
  if (saved.logoUrl) document.getElementById("logoUrl").value = saved.logoUrl;
  if (saved.logoFilter) document.getElementById("logoFilter").value = saved.logoFilter;
  if (saved.tagline) document.getElementById("tagline").value = saved.tagline;
  if (saved.greeting) document.getElementById("greeting").value = saved.greeting;
  if (saved.mainColor) document.getElementById("mainColor").value = saved.mainColor;
  if (saved.shopifyDomain) document.getElementById("shopifyDomain").value = saved.shopifyDomain;
  if (saved.bagKeywords) document.getElementById("bagKeywords").value = saved.bagKeywords;
  if (saved.walletKeywords) document.getElementById("walletKeywords").value = saved.walletKeywords;
  if (saved.budgetLow) document.getElementById("budgetLow").value = saved.budgetLow;
  if (saved.budgetMid) document.getElementById("budgetMid").value = saved.budgetMid;

  document.getElementById("saveBtn").addEventListener("click", () => {
    const config = {
      brandName: document.getElementById("brandName").value,
      logoUrl: document.getElementById("logoUrl").value,
      logoFilter: document.getElementById("logoFilter").value,
      tagline: document.getElementById("tagline").value,
      greeting: document.getElementById("greeting").value,
      mainColor: document.getElementById("mainColor").value,
      shopifyDomain: document.getElementById("shopifyDomain").value,
      bagKeywords: document.getElementById("bagKeywords").value,
      walletKeywords: document.getElementById("walletKeywords").value,
      budgetLow: document.getElementById("budgetLow").value,
      budgetMid: document.getElementById("budgetMid").value
    };
    localStorage.setItem("concierge_config", JSON.stringify(config));
    const msg = document.getElementById("statusMsg");
    msg.textContent = "設定を保存しました。";
    setTimeout(() => { msg.textContent = ""; }, 3000);
  });
</script>
</body>
</html>
