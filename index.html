<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light">
<title>ATELIER CUIR | コンシェルジュ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --color-main: #6e5340;
    --color-main-deep: #3f2e24;
    --color-bg: #f3eee7;
    --color-surface: #fbf8f4;
    --color-text: #2b241f;
    --color-muted: #75685c;
    --color-line: #e4d7c8;
    --color-accent: #8d6a45;
    --color-chip: #f3e7d8;
    --color-on-main: #fbf8f4;
    --color-user: #efe4d6;
    --radius: 18px;
    --shadow: 0 18px 40px rgba(63, 46, 36, 0.08);
    --font-serif: "Cormorant Garamond", "Times New Roman", serif;
    --font-sans: "Zen Kaku Gothic New", "Hiragino Sans", "Yu Gothic", sans-serif;
  }

  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    color: var(--color-text);
    font-family: var(--font-sans);
    background:
      radial-gradient(1200px 500px at 10% -10%, color-mix(in srgb, var(--color-accent) 18%, transparent), transparent 60%),
      radial-gradient(900px 420px at 110% 0%, color-mix(in srgb, var(--color-main) 14%, transparent), transparent 55%),
      var(--color-bg);
    letter-spacing: 0.01em;
  }

  button, input, textarea { font-family: inherit; color: inherit; }
  button { cursor: pointer; }
  :focus-visible {
    outline: 2px solid var(--color-accent);
    outline-offset: 2px;
  }

  .app {
    min-height: 100dvh;
    display: grid;
    grid-template-rows: auto auto 1fr auto auto;
    max-width: 1080px;
    margin: 0 auto;
    padding: 20px 20px 12px;
  }

  .header {
    display: flex;
    justify-content: space-between;
    gap: 16px;
    align-items: flex-end;
    padding-bottom: 14px;
    border-bottom: 1px solid var(--color-line);
  }
  .brand-block { min-width: 0; }
  .eyebrow {
    margin: 0 0 4px;
    font-size: 11px;
    letter-spacing: 0.22em;
    text-transform: uppercase;
    color: var(--color-accent);
  }
  .brand-row { display: flex; align-items: center; gap: 10px; }
  .brand {
    margin: 0;
    font-family: var(--font-serif);
    font-weight: 500;
    font-size: clamp(32px, 4vw, 44px);
    letter-spacing: 0.08em;
    line-height: 1;
  }
  .speak-dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: var(--color-accent);
    opacity: 0.35;
  }
  body.is-speaking .speak-dot {
    opacity: 1;
    animation: pulse 1s ease-in-out infinite;
  }
  @keyframes pulse {
    50% { transform: scale(1.45); opacity: 0.55; }
  }
  .tagline {
    margin: 8px 0 0;
    color: var(--color-muted);
    font-size: 13px;
  }
  .header-actions {
    display: flex;
    flex-wrap: wrap;
    justify-content: flex-end;
    gap: 8px;
  }
  .ghost, .solid, .mic, .send {
    border-radius: calc(var(--radius) - 6px);
    border: 1px solid var(--color-line);
    background: var(--color-surface);
    padding: 10px 14px;
    font-size: 13px;
    letter-spacing: 0.04em;
    transition: background 0.2s, border-color 0.2s, transform 0.2s;
  }
  .ghost[aria-pressed="true"] {
    background: var(--color-main);
    color: var(--color-on-main);
    border-color: var(--color-main);
  }
  .solid {
    background: var(--color-main);
    color: var(--color-on-main);
    border-color: var(--color-main);
  }
  .ghost:hover, .solid:hover, .mic:hover, .send:hover { transform: translateY(-1px); }

  .tuner {
    display: none;
    margin-top: 12px;
    padding: 14px;
    background: color-mix(in srgb, var(--color-surface) 88%, transparent);
    border: 1px solid var(--color-line);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
  }
  .tuner.open { display: grid; gap: 12px; }
  .tuner-grid {
    display: grid;
    grid-template-columns: 1.4fr 1.4fr 0.7fr 0.7fr 0.8fr;
    gap: 10px;
  }
  .field { display: grid; gap: 6px; font-size: 12px; color: var(--color-muted); }
  .field input[type="text"] {
    width: 100%;
    border: 1px solid var(--color-line);
    background: var(--color-bg);
    border-radius: 10px;
    padding: 8px 10px;
  }
  .field input[type="color"] {
    width: 100%;
    height: 38px;
    padding: 4px;
    border: 1px solid var(--color-line);
    background: var(--color-bg);
    border-radius: 10px;
  }
  .field input[type="range"] { width: 100%; accent-color: var(--color-main); }
  .tuner-note { margin: 0; font-size: 12px; color: var(--color-muted); }

  .thread {
    overflow: auto;
    padding: 22px 2px 12px;
    display: flex;
    flex-direction: column;
    gap: 14px;
    scroll-behavior: smooth;
  }
  .bubble {
    max-width: min(680px, 100%);
    padding: 14px 16px;
    border-radius: var(--radius);
    line-height: 1.75;
    font-size: 15px;
  }
  .bubble.concierge {
    background: var(--color-surface);
    border: 1px solid var(--color-line);
    box-shadow: var(--shadow);
  }
  .bubble.user {
    align-self: flex-end;
    background: var(--color-user);
    border: 1px solid var(--color-line);
  }
  .who {
    display: block;
    margin-bottom: 4px;
    font-size: 11px;
    letter-spacing: 0.16em;
    color: var(--color-accent);
  }

  .choices { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
  .choices.four { grid-template-columns: repeat(4, 1fr); }
  .choices:empty, .choices.hidden { display: none; }
  .choice {
    text-align: left;
    background: var(--color-surface);
    border: 1px solid var(--color-line);
    border-radius: var(--radius);
    padding: 14px 14px 12px;
    box-shadow: var(--shadow);
  }
  .choice:hover { border-color: var(--color-accent); }
  .choice strong { display: block; font-weight: 500; font-size: 16px; letter-spacing: 0.06em; }
  .choice span { display: block; margin-top: 4px; color: var(--color-muted); font-size: 12px; line-height: 1.5; }

  .products {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 12px;
  }
  .card {
    background: var(--color-surface);
    border: 1px solid var(--color-line);
    border-radius: var(--radius);
    overflow: hidden;
    box-shadow: var(--shadow);
    display: flex;
    flex-direction: column;
  }
  .card img {
    width: 100%;
    aspect-ratio: 4 / 3;
    object-fit: cover;
    background: var(--color-chip);
    display: block;
  }
  .card-body { padding: 12px 12px 14px; display: flex; flex-direction: column; gap: 8px; flex: 1; }
  .card-cat { margin: 0; font-size: 11px; letter-spacing: 0.14em; color: var(--color-accent); }
  .card h3 { margin: 0; font-family: var(--font-serif); font-size: 26px; font-weight: 500; letter-spacing: 0.03em; }
  .price { margin: 0; font-size: 14px; }
  .tags { display: flex; flex-wrap: wrap; gap: 6px; margin: 0; padding: 0; list-style: none; }
  .tags li {
    font-size: 11px;
    letter-spacing: 0.04em;
    padding: 4px 8px;
    border-radius: 999px;
    background: var(--color-chip);
  }
  .badge {
    align-self: flex-start;
    font-size: 11px;
    letter-spacing: 0.08em;
    color: var(--color-main-deep);
  }
  .product-link {
    margin-top: auto;
    display: inline-flex;
    justify-content: center;
    text-decoration: none;
    background: var(--color-main);
    color: var(--color-on-main);
    border-radius: calc(var(--radius) - 8px);
    padding: 10px 12px;
    font-size: 13px;
    letter-spacing: 0.08em;
  }
  .product-link:hover { filter: brightness(1.08); }

  .composer {
    display: grid;
    grid-template-columns: 1fr auto auto;
    gap: 8px;
    padding-top: 10px;
  }
  .composer input {
    border: 1px solid var(--color-line);
    background: var(--color-surface);
    border-radius: calc(var(--radius) - 4px);
    padding: 12px 14px;
    font-size: 15px;
  }
  .mic.listening {
    background: var(--color-main);
    color: var(--color-on-main);
    border-color: var(--color-main);
  }
  .hint {
    grid-column: 1 / -1;
    margin: 0;
    min-height: 1.2em;
    font-size: 12px;
    color: var(--color-muted);
  }

  .footer {
    margin-top: 8px;
    padding-top: 10px;
    border-top: 1px solid var(--color-line);
    display: flex;
    justify-content: space-between;
    gap: 12px;
    flex-wrap: wrap;
    font-size: 12px;
    color: var(--color-muted);
  }
  .footer strong { color: var(--color-main-deep); font-weight: 500; }

  dialog {
    width: min(560px, calc(100% - 28px));
    border: 1px solid var(--color-line);
    border-radius: var(--radius);
    padding: 0;
    background: var(--color-surface);
    color: var(--color-text);
    box-shadow: var(--shadow);
  }
  dialog::backdrop { background: rgba(43, 36, 31, 0.46); }
  .detail img { width: 100%; aspect-ratio: 16 / 10; object-fit: cover; background: var(--color-chip); }
  .detail-body { padding: 16px 18px 18px; }
  .detail-body h3 { margin: 6px 0; font-family: var(--font-serif); font-size: 34px; font-weight: 500; }
  .detail-actions { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 14px; }
  .link-note { font-size: 12px; color: var(--color-muted); word-break: break-all; }

  @media (max-width: 800px) {
    .app { padding: 14px 12px 8px; }
    .header { flex-direction: column; align-items: stretch; }
    .header-actions { justify-content: flex-start; }
    .tuner-grid, .choices, .choices.four, .products, .composer {
      grid-template-columns: 1fr;
    }
    .composer { grid-template-columns: 1fr 1fr; }
    .composer input { grid-column: 1 / -1; }
    .card h3 { font-size: 22px; }
  }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
      animation: none !important;
      transition: none !important;
      scroll-behavior: auto !important;
    }
  }
</style>
</head>
<body>
  <div class="app">
    <header class="header">
      <div class="brand-block">
        <p class="eyebrow" id="tagline">革と対話するコンシェルジュ</p>
        <div class="brand-row">
          <h1 class="brand" id="brandName">ATELIER CUIR</h1>
          <span class="speak-dot" id="speakDot" aria-hidden="true"></span>
        </div>
      </div>
      <div class="header-actions">
        <button class="ghost" id="voiceToggle" type="button" aria-pressed="true">音声ガイド: ON</button>
        <button class="ghost" id="themeBtn" type="button">テーマを切替</button>
        <button class="ghost" id="tuneBtn" type="button" aria-expanded="false">表示を調整</button>
        <button class="solid" id="resetBtn" type="button">最初からやり直す</button>
      </div>
    </header>

    <section class="tuner" id="tuner" aria-label="ブランド設定">
      <div class="tuner-grid">
        <label class="field">ブランド名
          <input id="tuneBrand" type="text" autocomplete="off">
        </label>
        <label class="field">挨拶文
          <input id="tuneGreeting" type="text" autocomplete="off">
        </label>
        <label class="field">メインカラー
          <input id="tuneMain" type="color">
        </label>
        <label class="field">背景色
          <input id="tuneBg" type="color">
        </label>
        <label class="field">角丸 <span id="radiusLabel"></span>
          <input id="tuneRadius" type="range" min="0" max="32" step="1">
        </label>
      </div>
      <p class="tuner-note">このパネルは画面内の設定オブジェクトをその場で書き換え、CSS変数へ反映します。サイトごとに変える場合はスクリプトの BRAND_PRESETS を編集するか、<code>?config=brand.json</code> で同じ形のJSONを読み込めます。</p>
    </section>

    <main class="thread" id="thread" aria-live="polite"></main>
    <div class="choices" id="choices"></div>

    <form class="composer" id="composer">
      <input id="answer" type="text" placeholder="選ぶか、文字で答えてください" autocomplete="off" aria-label="回答">
      <button class="mic" id="micBtn" type="button">🎙️ 声で答える</button>
      <button class="send" type="submit">送信</button>
      <p class="hint" id="hint"></p>
    </form>

    <footer class="footer">
      <span id="footerBrand">ATELIER CUIR</span>
      <span><strong>個人情報の入力はお控えください。</strong> この対話はお使いのブラウザの中だけで完結します。</span>
    </footer>
  </div>

  <dialog id="detail" class="detail">
    <img id="detailImg" alt="">
    <div class="detail-body">
      <p class="card-cat" id="detailCat"></p>
      <h3 id="detailName"></h3>
      <p id="detailPrice" class="price"></p>
      <p id="detailCopy"></p>
      <ul class="tags" id="detailTags"></ul>
      <p class="link-note" id="detailUrl"></p>
      <div class="detail-actions">
        <a class="product-link" id="detailLink" href="#" target="_blank" rel="noopener noreferrer">商品ページへ</a>
        <button class="ghost" id="detailClose" type="button">閉じる</button>
      </div>
    </div>
  </dialog>

let config = clone(BRAND_PRESETS[0]);
let presetIndex = 0;

  step: "category",
  category: null,
  style: null,
  budget: null,
  voice: true,
  listening: false
};

function clone(value) {
  return JSON.parse(JSON.stringify(value));
}
function escapeHtml(value) {
  return String(value).replace(/[&<>"']/g, (ch) => ({
    "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
  }[ch]));
}
function yen(price) {
  return "¥" + price.toLocaleString("ja-JP");
}
function placeholder(name) {
  const svg = `<svg xmlns="http://www.w3.org/2000/svg" width="800" height="600">
    <rect width="800" height="600" fill="#e7d7c4"/>
    <rect x="70" y="80" width="660" height="440" rx="28" fill="none" stroke="#6e5340" stroke-width="3"/>
    <text x="400" y="300" text-anchor="middle" font-family="Georgia, serif" font-size="36" fill="#3f2e24">${name}</text>
  </svg>`;
  return "data:image/svg+xml;charset=UTF-8," + encodeURIComponent(svg);
}
function findProduct(id) {
  return PRODUCTS.find((item) => item.id === id);
}

function applyConfig(next, options) {
  config = clone(next);
  const root = document.documentElement;
  Object.entries(config.theme).forEach(([key, value]) => root.style.setProperty(key, value));
  root.dataset.theme = config.appearance || "light";
  document.querySelector('meta[name="color-scheme"]').content = config.appearance === "dark" ? "dark" : "light";
  els.brandName.textContent = config.brandName;
  els.tagline.textContent = config.tagline;
  els.footerBrand.textContent = config.brandName;
  setControl(els.tuneBrand, config.brandName);
  setControl(els.tuneGreeting, config.greeting);
  setControl(els.tuneMain, toHex(config.theme["--color-main"]));
  setControl(els.tuneBg, toHex(config.theme["--color-bg"]));
  document.title = config.brandName + " | コンシェルジュ";
  const radius = parseInt(config.theme["--radius"], 10) || 0;
  els.tuneRadius.value = String(radius);
  els.radiusLabel.textContent = radius + "px";
  if (options && options.refreshGreeting && isOpening()) {
    messages = [{ role: "concierge", text: config.greeting }];
    if (options.speak) speak(config.greeting);
  }
  render();
}
function setControl(element, value) {
  if (element.value !== value) element.value = value;
}
function toHex(color) {
  const raw = String(color).trim();
  if (/^#[0-9a-fA-F]{6}$/.test(raw)) return raw.toLowerCase();
  return "#6e5340";
}
function isOpening() {
  return state.step === "category" && messages.every((message) => message.role === "concierge");
}

let voicesReady = false;
function pickVoice() {
  const voices = window.speechSynthesis ? window.speechSynthesis.getVoices() : [];
  return voices.find((voice) => voice.lang === "ja-JP")
    || voices.find((voice) => voice.lang && voice.lang.toLowerCase().startsWith("ja"))
    || null;
}
function speak(text) {
  if (!state.voice || !text || !window.speechSynthesis) return;
  const utterance = new SpeechSynthesisUtterance(text);
  utterance.lang = "ja-JP";
  utterance.rate = 0.96;
  const voice = pickVoice();
  if (voice) utterance.voice = voice;
  utterance.onstart = () => document.body.classList.add("is-speaking");
  utterance.onend = () => document.body.classList.remove("is-speaking");
  utterance.onerror = () => document.body.classList.remove("is-speaking");
  window.speechSynthesis.cancel();
  window.speechSynthesis.speak(utterance);
}
function stopSpeaking() {
  document.body.classList.remove("is-speaking");
  if (window.speechSynthesis) window.speechSynthesis.cancel();
}
if (window.speechSynthesis) {
  window.speechSynthesis.addEventListener("voiceschanged", () => {
    voicesReady = true;
  });
}

const Recognition = window.SpeechRecognition || window.webkitSpeechRecognition;
let recognition = null;
if (Recognition) {
  recognition = new Recognition();
  recognition.lang = "ja-JP";
  recognition.interimResults = true;
  recognition.continuous = false;
  recognition.onstart = () => {
    state.listening = true;
    els.micBtn.classList.add("listening");
    els.micBtn.textContent = "聴いています…";
    els.hint.textContent = "マイクに向かって、選択肢のことばで話してください。";
  };
  recognition.onend = () => {
    state.listening = false;
    els.micBtn.classList.remove("listening");
    els.micBtn.textContent = "🎙️ 声で答える";
  };
  recognition.onerror = (event) => {
    const reason = event.error === "not-allowed"
      ? "マイクの使用が許可されていません。"
      : "音声を取得できませんでした。ボタンからも選べます。";
    els.hint.textContent = reason;
  };
  recognition.onresult = (event) => {
    let finalText = "";
    let interim = "";
    for (let i = event.resultIndex; i < event.results.length; i += 1) {
      const transcript = event.results[i][0].transcript;
      if (event.results[i].isFinal) finalText += transcript;
      else interim += transcript;
    }
    els.answer.value = (finalText || interim).trim();
    if (finalText.trim()) submitAnswer(finalText.trim());
  };
} else {
  els.micBtn.disabled = true;
  els.micBtn.textContent = "音声入力非対応";
}

function setVoice(on) {
  state.voice = on;
  els.voiceToggle.setAttribute("aria-pressed", on ? "true" : "false");
  els.voiceToggle.textContent = on ? "音声ガイド: ON" : "音声ガイド: OFF";
  if (!on) stopSpeaking();
}

function currentOptions() {
  if (state.step === "category") return CATEGORIES;
  if (state.step === "style") return STYLES;
  if (state.step === "budget") return BUDGETS;
  return [];
}
function promptFor(step) {
  if (step === "category") return config.greeting;
  if (step === "style") {
    return CATEGORY_LABEL[state.category] + "ですね。お好みのデザインを教えてください。";
  }
  if (step === "budget") return "かしこまりました。ご予算の目安を教えてください。税込でご提案します。";
  return "ご条件に近い3点をご用意しました。気になる一品は、商品ページで質感や詳細をご覧いただけます。";
}

function inCategory(product, category) {
  if (category === "gift") return product.category === "gift" || product.gift;
  return product.category === category;
}
function matchesBudget(price, budget) {
  if (budget === "under30") return price <= 30000;
  if (budget === "mid") return price > 30000 && price <= 80000;
  if (budget === "high") return price > 80000;
  return true;
}
function budgetCenter(budget) {
  if (budget === "under30") return 20000;
  if (budget === "mid") return 55000;
  return 100000;
}
function recommend() {
  const center = budgetCenter(state.budget);
  const inCat = PRODUCTS.filter((product) => inCategory(product, state.category));
  const strict = inCat
    .filter((product) => product.styles.includes(state.style))
    .map((product) => ({ product, matched: true }))
    .sort((a, b) => {
      const budgetDelta = Number(matchesBudget(b.product.price, state.budget)) - Number(matchesBudget(a.product.price, state.budget));
      if (budgetDelta) return budgetDelta;
      return Math.abs(a.product.price - center) - Math.abs(b.product.price - center);
    });
  const picked = strict.slice(0, 3);
  if (picked.length < 3) {
    inCat.forEach((product) => {
      if (picked.length >= 3 || picked.some((item) => item.product.id === product.id)) return;
      picked.push({ product, matched: false });
    });
  }
  return { items: picked, relaxed: picked.some((item) => !item.matched) };
}

function render() {
  els.thread.innerHTML = messages.map((message) => {
    if (message.role === "products") return renderProducts(message.items);
    const who = message.role === "user" ? "あなた" : config.brandName;
    return `<article class="bubble ${message.role === "user" ? "user" : "concierge"}">
      <span class="who">${escapeHtml(who)}</span>${escapeHtml(message.text)}</article>`;
  }).join("");
  els.thread.scrollTop = els.thread.scrollHeight;

  const options = currentOptions();
  els.choices.className = "choices" + (options.length === 4 ? " four" : "") + (options.length ? "" : " hidden");
  els.choices.innerHTML = options.map((option) => `
    <button class="choice" type="button" data-choice="${option.id}">
      <strong>${escapeHtml(option.label)}</strong>
      <span>${escapeHtml(option.hint)}</span>
    </button>`).join("");
}
function renderProducts(items) {
  return `<div class="products">${items.map(({ product, matched }) => `
    <article class="card">
      <img src="${escapeHtml(product.image)}" alt="${escapeHtml(product.name)}"
        data-fallback="${escapeHtml(placeholder(product.name))}">
      <div class="card-body">
        <p class="card-cat">${escapeHtml(CATEGORY_LABEL[product.category] || "")}</p>
        <h3>${escapeHtml(product.name)}</h3>
        <p class="price">${yen(product.price)} <span style="color:var(--color-muted)">税込</span></p>
        <p class="badge">${matched ? "条件に一致" : "近い候補"}</p>
        <ul class="tags">${product.styles.map((style) => `<li>${escapeHtml(STYLE_LABEL[style] || style)}</li>`).join("")}</ul>
        <a class="product-link" href="${escapeHtml(product.url)}" data-product="${escapeHtml(product.id)}"
          ${/^https?:\/\//i.test(product.url) ? 'target="_blank" rel="noopener noreferrer"' : ""}>商品ページへ</a>
      </div>
    </article>`).join("")}</div>`;
}

function pushConcierge(text) {
  messages.push({ role: "concierge", text });
  render();
  speak(text);
}
function choose(id) {
  const option = currentOptions().find((item) => item.id === id);
  if (!option) return;
  messages.push({ role: "user", text: option.label });
  if (state.step === "category") {
    state.category = id;
    state.step = "style";
    pushConcierge(promptFor("style"));
    return;
  }
  if (state.step === "style") {
    state.style = id;
    state.step = "budget";
    pushConcierge(promptFor("budget"));
    return;
  }
  if (state.step === "budget") {
    state.budget = id;
    const result = recommend();
    state.step = "result";
    const count = result.items.length;
    const text = result.relaxed
      ? "条件にぴったり合う点が" + count + "点に満たないため、近い候補も加えてお見せします。商品ページで細部をご確認ください。"
      : "ご条件に合う" + count + "点をご用意しました。気になる一品は、商品ページで質感や詳細をご覧いただけます。";
    messages.push({ role: "concierge", text });
    messages.push({ role: "products", items: result.items });
    render();
    speak(text);
  }
}

function parseCategory(text) {
  if (/ギフト|贈り物|プレゼント|贈答/.test(text)) return "gift";
  if (/財布|さいふ|小物|カードケース|キーケース/.test(text)) return "wallet";
  if (/バッグ|バック|かばん|鞄|トート|ショルダー/.test(text)) return "bag";
  return null;
}
function parseStyle(text) {
  if (/ミニマル|シンプル|無駄/.test(text)) return "minimal";
  if (/スタイリッシュ|かっこ|シャープ|モダン|都会/.test(text)) return "stylish";
  if (/カジュアル|日常|気軽|やわらか/.test(text)) return "casual";
  if (/クラシック|伝統|上品|格式/.test(text)) return "classic";
  return null;
}
function parseBudget(text) {
  const normalized = text.replace(/,/g, "");
  if (/8万以上|八万以上|プレミアム|高め|こだわら/.test(normalized)) return "high";
  if (/以下|まで|以内|安い|お手頃|3万以下|2万|２万|1万|１万|万以下/.test(normalized)) return "under30";
  const man = normalized.match(/(\d+)\s*万/);
  if (man) {
    const value = Number(man[1]);
    if (value <= 3) return "under30";
    if (value <= 8) return "mid";
    return "high";
  }
  if (/中くらい|普通|標準|3から8|3〜8|3～8/.test(normalized)) return "mid";
  return null;
}
function parseForStep(text) {
  if (state.step === "category") return parseCategory(text);
  if (state.step === "style") return parseStyle(text);
  if (state.step === "budget") return parseBudget(text);
  return null;
}
function submitAnswer(text) {
  const cleaned = text.trim();
  if (!cleaned) return;
  els.answer.value = "";
  if (state.step === "result") {
    messages.push({ role: "user", text: cleaned });
    pushConcierge("ほかの条件でお探しになるときは、「最初からやり直す」を押してください。");
    return;
  }
  const id = parseForStep(cleaned);
  if (!id) {
    messages.push({ role: "user", text: cleaned });
    pushConcierge("恐れ入ります。下の選択肢に近いことばで、もう一度教えてください。");
    return;
  }
  choose(id);
}

function openDetail(product) {
  els.detailImg.src = product.image;
  els.detailImg.alt = product.name;
  els.detailImg.onerror = () => { els.detailImg.src = placeholder(product.name); };
  els.detailCat.textContent = CATEGORY_LABEL[product.category] || "";
  els.detailName.textContent = product.name;
  els.detailPrice.textContent = yen(product.price) + "（税込）";
  els.detailCopy.textContent = product.copy;
  els.detailTags.innerHTML = product.styles.map((style) => `<li>${escapeHtml(STYLE_LABEL[style] || style)}</li>`).join("");
  els.detailUrl.textContent = "商品リンク: " + product.url;
  els.detailLink.href = product.url;
  if (/^https?:\/\//i.test(product.url)) {
    els.detailLink.target = "_blank";
    els.detailLink.rel = "noopener noreferrer";
  } else {
    els.detailLink.target = "";
    els.detailLink.removeAttribute("rel");
  }
  if (location.hash !== "#" + product.id) history.replaceState(null, "", "#" + product.id);
  els.detail.showModal();
}
function openFromHash() {
  const id = location.hash.replace(/^#/, "");
  const product = findProduct(id);
  if (product) openDetail(product);
}

function resetConversation() {
  stopSpeaking();
  if (recognition && state.listening) recognition.stop();
  state.step = "category";
  state.category = null;
  state.style = null;
  state.budget = null;
  messages = [{ role: "concierge", text: config.greeting }];
  els.hint.textContent = "";
  els.answer.value = "";
  if (location.hash) history.replaceState(null, "", location.pathname + location.search);
  render();
  speak(config.greeting);
}

els.voiceToggle.addEventListener("click", () => setVoice(!state.voice));
els.themeBtn.addEventListener("click", () => {
  presetIndex = (presetIndex + 1) % BRAND_PRESETS.length;
  applyConfig(BRAND_PRESETS[presetIndex], { refreshGreeting: true, speak: true });
  els.hint.textContent = config.brandName + " の表示に切り替えました。";
});
els.tuneBtn.addEventListener("click", () => {
  const open = els.tuner.classList.toggle("open");
  els.tuneBtn.setAttribute("aria-expanded", open ? "true" : "false");
});
els.resetBtn.addEventListener("click", resetConversation);
els.choices.addEventListener("click", (event) => {
  const button = event.target.closest("[data-choice]");
  if (!button) return;
  choose(button.dataset.choice);
});
els.thread.addEventListener("click", (event) => {
  const link = event.target.closest("[data-product]");
  if (!link) return;
  const product = findProduct(link.dataset.product);
  if (!product) return;
  if (/^https?:\/\//i.test(product.url)) return;
  event.preventDefault();
  openDetail(product);
});
els.thread.addEventListener("error", (event) => {
  const img = event.target;
  if (img.tagName !== "IMG" || !img.dataset.fallback || img.dataset.broken) return;
  img.dataset.broken = "1";
  img.src = img.dataset.fallback;
}, true);
els.composer.addEventListener("submit", (event) => {
  event.preventDefault();
  submitAnswer(els.answer.value);
});
els.micBtn.addEventListener("click", () => {
  if (!recognition) {
    els.hint.textContent = "このブラウザは音声入力に対応していません。選択肢か文字でお答えください。";
    return;
  }
  if (!window.isSecureContext) {
    els.hint.textContent = "音声入力は localhost か HTTPS で開いたときに使えます。";
    return;
  }
  if (state.listening) {
    recognition.stop();
    return;
  }
  try {
    recognition.start();
  } catch (error) {
    els.hint.textContent = "マイクを開始できませんでした。少し待って再度お試しください。";
  }
});
["tuneBrand", "tuneGreeting", "tuneMain", "tuneBg", "tuneRadius"].forEach((id) => {
  els[id].addEventListener("input", () => {
    config.brandName = els.tuneBrand.value || config.brandName;
    config.greeting = els.tuneGreeting.value || config.greeting;
    config.theme["--color-main"] = els.tuneMain.value;
    config.theme["--color-bg"] = els.tuneBg.value;
    config.theme["--radius"] = els.tuneRadius.value + "px";
    applyConfig(config, { refreshGreeting: true });
  });
});
els.detailClose.addEventListener("click", () => els.detail.close());
els.detail.addEventListener("click", (event) => {
  if (event.target === els.detail) els.detail.close();
});
els.detailLink.addEventListener("click", (event) => {
  const id = location.hash.replace(/^#/, "");
  const product = findProduct(id);
  if (product && !/^https?:\/\//i.test(product.url)) event.preventDefault();
});
window.addEventListener("hashchange", openFromHash);

async function loadExternalConfig() {
  const source = new URLSearchParams(location.search).get("config");
  if (!source) return;
  try {
    const response = await fetch(source);
    if (!response.ok) throw new Error("config");
    const incoming = await response.json();
    const merged = clone(config);
    ["brandName", "tagline", "greeting", "appearance"].forEach((key) => {
      if (incoming[key]) merged[key] = incoming[key];
    });
    if (incoming.theme) Object.assign(merged.theme, incoming.theme);
    applyConfig(merged, { refreshGreeting: true, speak: true });
    els.hint.textContent = "外部のブランド設定を読み込みました。";
  } catch (error) {
    els.hint.textContent = "ブランド設定の読み込みに失敗しました。画面内の設定を使います。";
  }
}

applyConfig(config);
resetConversation();
loadExternalConfig();
openFromHash();
</script>
</body>
</html>
