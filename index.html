<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light">
<title id="pageTitle">コンシェルジュ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=Zen+Kaku+Gothic+New:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --color-main: #6e5340;
    --color-main-deep: #2c221b;
    --color-bg: #f9f8f6;
    --color-surface: #ffffff;
    --color-text: #2b2520;
    --color-muted: #8c8278;
    --color-line: #eae4db;
    --color-accent: #9e7d5d;
    --color-user: #f3eee7;
    --radius: 12px;
    --shadow: 0 10px 30px rgba(43, 37, 32, 0.03);
    --font-serif: "Cormorant Garamond", "Times New Roman", serif;
    --font-sans: "Zen Kaku Gothic New", "Hiragino Sans", sans-serif;
  }

  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    color: var(--color-text);
    font-family: var(--font-sans);
    background: var(--color-bg);
    letter-spacing: 0.04em;
    -webkit-font-smoothing: antialiased;
    padding-bottom: 80px; /* フローティングメニュー分の余白 */
  }

  button { font-family: inherit; color: inherit; cursor: pointer; }

  .app {
    min-height: 100dvh;
    display: grid;
    grid-template-rows: auto 1fr auto;
    max-width: 800px;
    margin: 0 auto;
    padding: 24px 20px 20px;
  }

  .header {
    display: flex;
    justify-content: space-between;
    align-items: flex-end;
    padding-bottom: 16px;
    border-bottom: 1px solid var(--color-line);
    margin-bottom: 12px;
  }
  .eyebrow {
    margin: 0 0 4px;
    font-size: 9px;
    letter-spacing: 0.25em;
    text-transform: uppercase;
    color: var(--color-accent);
    font-weight: 500;
  }
  
  .brand-logo { max-height: 36px; width: auto; object-fit: contain; display: block; }
  .filter-sepia { filter: sepia(100%) hue-rotate(320deg) saturate(60%) brightness(90%); }
  .filter-dark { filter: brightness(40%) contrast(150%); }
  .filter-monochrome { filter: grayscale(100%) contrast(120%); }

  .brand {
    margin: 0;
    font-family: var(--font-serif);
    font-weight: 500;
    font-size: clamp(22px, 3.5vw, 32px);
    letter-spacing: 0.06em;
    line-height: 1;
  }
  .btn-reset {
    background: transparent;
    border: 1px solid var(--color-line);
    border-radius: var(--radius);
    padding: 6px 12px;
    font-size: 11px;
    color: var(--color-muted);
    display: inline-flex;
    align-items: center;
    gap: 4px;
    transition: all 0.2s;
  }
  .btn-reset svg { width: 12px; height: 12px; fill: currentColor; }
  .btn-reset:hover { border-color: var(--color-accent); color: var(--color-text); }

  .thread {
    overflow-y: auto;
    padding: 10px 0;
    display: flex;
    flex-direction: column;
    gap: 14px;
  }
  .bubble {
    max-width: min(560px, 100%);
    padding: 14px 16px;
    border-radius: var(--radius);
    line-height: 1.7;
    font-size: 13px;
    background: var(--color-surface);
    border: 1px solid var(--color-line);
    box-shadow: var(--shadow);
  }
  .bubble.user {
    align-self: flex-end;
    background: var(--color-user);
    border-color: transparent;
    box-shadow: none;
  }
  .who {
    display: block;
    margin-bottom: 4px;
    font-size: 8px;
    letter-spacing: 0.2em;
    color: var(--color-accent);
    text-transform: uppercase;
  }

  .user-selected-img {
    width: 100%;
    max-width: 160px;
    aspect-ratio: 16 / 9;
    object-fit: cover;
    border-radius: 6px;
    margin-top: 6px;
    display: block;
    border: 1px solid var(--color-line);
  }

  /* スマホ1画面に4つ収まるグリッド・コンパクトカード設計 */
  .choices {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 8px;
    margin-top: 10px;
  }
  .choices:empty, .choices.hidden { display: none; }
  
  .choice {
    text-align: left;
    background: var(--color-surface);
    border: 1px solid var(--color-line);
    border-radius: 10px;
    padding: 10px;
    box-shadow: var(--shadow);
    transition: all 0.2s;
    overflow: hidden;
    display: flex;
    flex-direction: column;
  }
  .choice:hover { border-color: var(--color-accent); transform: translateY(-1px); }
  
  .choice-img {
    width: calc(100% + 20px);
    margin: -10px -10px 8px -10px;
    aspect-ratio: 16 / 9;
    object-fit: cover;
    background: #f4f0eb;
    display: block;
  }

  .choice strong { display: block; font-weight: 500; font-size: 12px; letter-spacing: 0.03em; }
  .choice span { display: block; margin-top: 2px; color: var(--color-muted); font-size: 10px; line-height: 1.3; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }

  /* 商品提案カード */
  .products {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 12px;
    margin-top: 12px;
  }
  .card {
    background: var(--color-surface);
    border: 1px solid var(--color-line);
    border-radius: var(--radius);
    overflow: hidden;
    box-shadow: var(--shadow);
    display: flex;
    flex-direction: column;
  }
  .card img, .card-img-placeholder {
    width: 100%;
    aspect-ratio: 1 / 1;
    object-fit: cover;
    background: #f4f0eb;
  }
  .card-img-placeholder {
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--color-accent);
  }
  .card-img-placeholder svg { width: 28px; height: 28px; fill: currentColor; opacity: 0.6; }

  .card-body { padding: 12px; display: flex; flex-direction: column; gap: 4px; flex: 1; }
  .card-cat { margin: 0; font-size: 8px; letter-spacing: 0.2em; color: var(--color-accent); text-transform: uppercase; }
  .card h3 { margin: 0; font-size: 12px; font-weight: 500; line-height: 1.4; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .price { margin: 0; font-size: 11px; font-weight: 500; color: var(--color-main); }
  .product-link {
    margin-top: 6px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 4px;
    text-decoration: none;
    background: var(--color-main);
    color: #fff;
    border-radius: 6px;
    padding: 6px 10px;
    font-size: 10px;
    letter-spacing: 0.06em;
    transition: opacity 0.2s;
  }
  .product-link svg { width: 10px; height: 10px; fill: currentColor; }
  .product-link:hover { opacity: 0.9; }

  /* 下部フローティングメニュー（ランキング・カテゴリ・素材・金額） */
  .floating-nav {
    position: fixed;
    bottom: 0;
    left: 0;
    width: 100%;
    background: rgba(255, 255, 255, 0.95);
    backdrop-filter: blur(8px);
    border-top: 1px solid var(--color-line);
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    padding: 8px 12px;
    gap: 6px;
    z-index: 1000;
    box-shadow: 0 -4px 20px rgba(43, 37, 32, 0.05);
  }
  .nav-btn {
    background: transparent;
    border: none;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 3px;
    padding: 6px 4px;
    color: var(--color-muted);
    font-size: 10px;
    font-weight: 500;
    border-radius: 8px;
    transition: all 0.2s;
  }
  .nav-btn svg { width: 18px; height: 18px; fill: currentColor; }
  .nav-btn:hover, .nav-btn.active { color: var(--color-main); background: #f4f0eb; }

  .footer {
    margin-top: 20px;
    display: flex;
    justify-content: space-between;
    font-size: 9px;
    color: var(--color-muted);
  }

  @media (max-width: 768px) {
    .app { padding: 16px 12px 12px; }
    .products { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>
  <div class="app">
    <header class="header">
      <div class="brand-block">
        <p class="eyebrow" id="taglineLabel">革と対話するコンシェルジュ</p>
        <div class="brand-row" id="brandContainer">
          <h1 class="brand" id="brandNameLabel">DAYSART -Classic-</h1>
        </div>
      </div>
      <button class="btn-reset" id="resetBtn" type="button">
        <svg viewBox="0 0 24 24"><path d="M17.65 6.35A7.958 7.958 0 0012 4c-4.42 0-7.99 3.58-7.99 8s3.57 8 7.99 8c3.73 0 6.84-2.55 7.73-6h-2.08A5.99 5.99 0 0112 18c-3.31 0-6-2.69-6-6s2.69-6 6-6c1.66 0 3.14.69 4.22 1.78L13 11h7V4l-2.35 2.35z"/></svg>
        最初から
      </button>
    </header>

    <main class="thread" id="thread" aria-live="polite"></main>
    <div class="choices" id="choices"></div>

    <footer class="footer">
      <span id="footerBrand">DAYSART -Classic-</span>
      <span>Secure Concierge Widget</span>
    </footer>
  </div>

  <!-- 下部フローティングメニュー -->
  <nav class="floating-nav" id="floatingNav">
    <button class="nav-btn" data-action="ranking" type="button">
      <svg viewBox="0 0 24 24"><path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"/></svg>
      ランキング
    </button>
    <button class="nav-btn" data-action="category" type="button">
      <svg viewBox="0 0 24 24"><path d="M10 4H4c-1.1 0-1.99.9-1.99 2L2 18c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V8c0-1.1-.9-2-2-2h-8l-2-2z"/></svg>
      カテゴリ
    </button>
    <button class="nav-btn" data-action="material" type="button">
      <svg viewBox="0 0 24 24"><path d="M12 3c-4.97 0-9 4.03-9 9 0 2.12.74 4.07 1.97 5.61L4.35 19h4.15C9.69 19.62 10.81 20 12 20c4.97 0 9-4.03 9-9s-4.03-9-9-9zm0 15c-3.31 0-6-2.69-6-6s2.69-6 6-6 6 2.69 6 6-2.69 6-6 6z"/></svg>
      素材
    </button>
    <button class="nav-btn" data-action="budget" type="button">
      <svg viewBox="0 0 24 24"><path d="M21 18v1c0 1.1-.9 2-2 2H5c-1.11 0-2-.9-2-2V5c0-1.1.89-2 2-2h14c1.1 0 2 .9 2 2v1h-9c-1.11 0-2 .9-2 2v8c0 1.1.89 2 2 2h9zm-9-2h10V8H12v8zm4-2.5c-.83 0-1.5-.67-1.5-1.5s.67-1.5 1.5-1.5 1.5.67 1.5 1.5-.67 1.5-1.5 1.5z"/></svg>
      金額
    </button>
  </nav>

<script>
  const customConfig = JSON.parse(localStorage.getItem("concierge_config") || "{}");
  
  const config = {
    brandName: customConfig.brandName || "DAYSART -Classic-",
    logoUrl: customConfig.logoUrl || "",
    logoFilter: customConfig.logoFilter || "none",
    tagline: customConfig.tagline || "革と対話するコンシェルジュ",
    greeting: customConfig.greeting || "ようこそ。革の表情から、今日の一品を一緒に見つけましょう。下のメニューからお選びください。",
    mainColor: customConfig.mainColor || "#6e5340",
    shopifyDomain: customConfig.shopifyDomain || "https://daysart-classic.com",
    purposes: customConfig.purposes || []
  };

  const TYPE_OPTIONS = [
    { id: "all_types", label: "すべてのアイテム", hint: "素材に合うすべての商品から探す", keywords: "" },
    { id: "bag", label: "バッグ（トート・ショルダー）", hint: "トート、ショルダー、リュックなど", keywords: ["バッグ", "トート", "ショルダー", "リュック", "ブリーフ", "鞄", "ミニトート"] },
    { id: "wallet", label: "財布・ウォレット", hint: "長財布、二つ折り、コンパクト財布など", keywords: ["財布", "ウォレット", "二つ折り", "ロング", "マネークリップ"] },
    { id: "goods", label: "キーケース・革小物", hint: "キーケース、名刺入れ、スマート小物など", keywords: ["キーケース", "名刺入れ", "カードケース", "カバー", "ケース", "小物"] }
  ];

  const BUDGET_OPTIONS = [
    { id: "all", label: "指定なし（全価格帯）", hint: "価格にこだわらずおすすめを見る", min: 0, max: 9999999 },
    { id: "low", label: "〜 20,000円", hint: "手軽な革小物やコンパクトアイテム", min: 0, max: 20000 },
    { id: "mid", label: "20,000円 〜 50,000円", hint: "本格的なお財布やスマートバッグ", min: 20001, max: 50000 },
    { id: "high", label: "50,000円 〜", hint: "ワンランク上のプレミアムレザー", min: 50001, max: 9999999 }
  ];

  const RESET_OPTIONS = [
    { id: "restart", label: "最初からやり直す", hint: "条件を選び直す" }
  ];

  const brandContainer = document.getElementById("brandContainer");
  if (config.logoUrl) {
    let filterClass = "";
    if (config.logoFilter === "sepia") filterClass = "filter-sepia";
    else if (config.logoFilter === "dark") filterClass = "filter-dark";
    else if (config.logoFilter === "monochrome") filterClass = "filter-monochrome";
    brandContainer.innerHTML = `<img src="${config.logoUrl}" alt="${config.brandName}" class="brand-logo ${filterClass}">`;
  } else {
    document.getElementById("brandNameLabel").textContent = config.brandName;
  }

  document.getElementById("pageTitle").textContent = config.brandName + " | コンシェルジュ";
  document.getElementById("taglineLabel").textContent = config.tagline;
  document.getElementById("footerBrand").textContent = config.brandName;
  document.documentElement.style.setProperty("--color-main", config.mainColor);

  let PRODUCTS = [];
  let messages = [{ role: "concierge", text: config.greeting }];
  
  const state = {
    step: "menu", // 初期状態はメニュー選択待ち
    selectedAction: null,
    selectedCategory: null,
    selectedType: null,
    selectedBudget: null,
    productOffset: 0
  };

  async function syncShopifyProducts() {
    if (!config.shopifyDomain) return;
    try {
      const url = config.shopifyDomain.replace(/\/$/, '') + '/products.json';
      const res = await fetch(url);
      if (!res.ok) return;
      const data = await res.json();
      if (data.products && data.products.length > 0) {
        PRODUCTS = data.products.map(p => {
          const rawPrice = p.variants[0]?.price || "0";
          const numericPrice = Math.round(parseFloat(rawPrice));
          const tagList = p.tags ? (Array.isArray(p.tags) ? p.tags : p.tags.split(',')).map(t => t.trim()) : [];
          return {
            id: p.handle,
            name: p.title,
            price: numericPrice,
            url: `${config.shopifyDomain.replace(/\/$/, '')}/products/${p.handle}`,
            image: p.images[0]?.src || "",
            tags: tagList,
            searchText: (p.title + " " + tagList.join(" ")).toLowerCase()
          };
        });
      }
    } catch (e) {
      console.log("Shopify同期エラー", e);
    }
  }

  function render() {
    const thread = document.getElementById("thread");
    thread.innerHTML = messages.map(m => `
      <div class="bubble ${m.role}">
        <span class="who">${m.role === 'concierge' ? config.brandName : 'あなた'}</span>
        <div>${m.text}</div>
        ${m.image ? `<img src="${m.image}" alt="選択画像" class="user-selected-img">` : ''}
        ${m.products && m.products.length > 0 ? `
          <div class="products">
            ${m.products.map(p => `
              <div class="card">
                ${p.image 
                  ? `<img src="${p.image}" alt="${p.name}">` 
                  : `<div class="card-img-placeholder"><svg viewBox="0 0 24 24"><path d="M19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm0 16H5V5h14v14zm-5.04-6.71l-2.75 3.54-1.96-2.36L6.5 17h11l-3.54-4.71z"/></svg></div>`
                }
                <div class="card-body">
                  <p class="card-cat">${state.selectedCategory ? state.selectedCategory.label : 'アイテム'}</p>
                  <h3>${p.name}</h3>
                  <p class="price">${p.price > 0 ? p.price.toLocaleString() + '円 税込' : ''}</p>
                  <a class="product-link" href="${p.url}" target="_blank">
                    商品を見る
                    <svg viewBox="0 0 24 24"><path d="M19 19H5V5h7V3H5c-1.11 0-2 .9-2 2v14c0 1.1.89 2 2 2h14c1.1 0 2-.9 2-2v-7h-2v7zM14 3v2h3.59l-9.83 9.83 1.41 1.41L19 6.41V10h2V3h-7z"/></svg>
                  </a>
                </div>
              </div>
            `).join('')}
          </div>
        ` : ''}
      </div>
    `).join('');
    thread.scrollTop = thread.scrollHeight;

    const opts = currentOptions();
    const choicesEl = document.getElementById("choices");
    if (opts.length > 0) {
      choicesEl.className = "choices";
      choicesEl.innerHTML = opts.map(o => `
        <button class="choice" type="button" data-id="${o.id}">
          ${o.image ? `<img src="${o.image}" alt="${o.label}" class="choice-img">` : ''}
          <strong>${o.label}</strong>
          <span>${o.hint || ''}</span>
        </button>
      `).join('');
      document.querySelectorAll(".choice").forEach(btn => {
        btn.addEventListener("click", () => handleSelect(btn.dataset.id));
      });
    } else {
      choicesEl.innerHTML = "";
      choicesEl.className = "choices hidden";
    }

    // フローティングメニューのactive状態更新
    document.querySelectorAll(".nav-btn").forEach(btn => {
      if (btn.dataset.action === state.selectedAction) {
        btn.classList.add("active");
      } else {
        btn.classList.remove("active");
      }
    });
  }

  function currentOptions() {
    if (state.step === "category_select") {
      // 全カテゴリを平坦に並べて一発選択
      let list = [];
      config.purposes.forEach(p => {
        p.categories.forEach(c => {
          list.push({ id: c.id, label: c.label, hint: c.hint, image: c.image || "" });
        });
      });
      return list;
    }
    if (state.step === "material_select") {
      return config.purposes.map(p => ({ id: p.id, label: p.label, hint: p.hint, image: p.image || "" }));
    }
    if (state.step === "budget_select") {
      return BUDGET_OPTIONS;
    }
    if (state.step === "ranking_select") {
      return [
        { id: "rank_bag", label: "バッグ部門 人気TOP3", hint: "今最も選ばれている上質バッグ", image: "" },
        { id: "rank_wallet", label: "財布部門 人気TOP3", hint: "機能美を極めたコンパクトウォレット", image: "" }
      ];
    }
    if (state.step === "sub_category") {
      return state.selectedPurposeCategories || [];
    }
    if (state.step === "type_sub") {
      return TYPE_OPTIONS;
    }
    if (state.step === "budget") {
      return BUDGET_OPTIONS;
    }
    if (state.step === "done") {
      return RESET_OPTIONS;
    }
    return [];
  }

  function handleNavClick(action) {
    state.selectedAction = action;
    state.productOffset = 0;

    if (action === "ranking") {
      state.step = "ranking_select";
      messages.push({ role: "user", text: "ランキングから探す" });
      messages.push({ role: "concierge", text: "人気のランキング部門をお選びください。" });
    } else if (action === "category") {
      state.step = "category_select";
      messages.push({ role: "user", text: "カテゴリから探す" });
      messages.push({ role: "concierge", text: "お探しのカテゴリーをお選びください。" });
    } else if (action === "material") {
      state.step = "material_select";
      messages.push({ role: "user", text: "素材・用途から探す" });
      messages.push({ role: "concierge", text: "気になる素材やご用途をお選びください。" });
    } else if (action === "budget") {
      state.step = "budget_select";
      messages.push({ role: "user", text: "金額から探す" });
      messages.push({ role: "concierge", text: "ご予算の目安をお選びください。" });
    }
    render();
  }

  function getMatchedProducts(category, budget) {
    let matched = [];
    const minPrice = budget ? budget.min : 0;
    const maxPrice = budget ? budget.max : 9999999;

    const csvTags = (category ? (category.tags || "") : "").split(',').map(t => t.trim().toLowerCase()).filter(Boolean);
    const csvKeywords = (category ? (category.keywords || "") : "").split(',').map(k => k.trim().toLowerCase()).filter(Boolean);

    let typeKeywords = [];
    if (state.selectedType && state.selectedType.id !== "all_types") {
      typeKeywords = state.selectedType.keywords;
    }

    let candidates = PRODUCTS.filter(p => {
      if (p.price < minPrice || p.price > maxPrice) return false;

      let matchMaterial = true;
      if (csvTags.length > 0 || csvKeywords.length > 0) {
        const targets = [...csvTags, ...csvKeywords];
        matchMaterial = targets.some(t => p.searchText.includes(t));
      }

      let matchType = true;
      if (typeKeywords.length > 0) {
        matchType = typeKeywords.some(k => p.searchText.includes(k.toLowerCase()));
      }

      return matchMaterial && matchType;
    });

    if (candidates.length === 0) {
      candidates = PRODUCTS.filter(p => p.price >= minPrice && p.price <= maxPrice);
    }

    candidates.sort((a, b) => b.price - a.price);

    if (candidates.length > 0) {
      state.productOffset = (state.productOffset + 3) % candidates.length;
      matched = candidates.slice(state.productOffset, state.productOffset + 3);
      if (matched.length < 3 && candidates.length >= 3) {
        matched = matched.concat(candidates.slice(0, 3 - matched.length));
      }
    }
    return matched;
  }

  function handleSelect(id) {
    if (id === "restart") {
      messages.push({ role: "user", text: "最初からやり直す" });
      resetFlow();
      return;
    }

    if (state.step === "ranking_select") {
      const isBag = id === "rank_bag";
      messages.push({ role: "user", text: isBag ? "バッグ部門 人気TOP3" : "財布部門 人気TOP3" });
      
      // ランキング用疑似抽出
      const matched = PRODUCTS.slice(0, 3);
      state.step = "done";
      messages.push({
        role: "concierge",
        text: "今週特に人気の高かったおすすめアイテムTOP3です。",
        products: matched
      });
    } else if (state.step === "category_select") {
      // どの目的の中にあるカテゴリかを探す
      let foundCat = null;
      config.purposes.forEach(p => {
        const c = p.categories.find(cat => cat.id === id);
        if (c) foundCat = c;
      });
      if (!foundCat) return;
      state.selectedCategory = foundCat;
      state.step = "budget";
      messages.push({ role: "user", text: foundCat.label });
      messages.push({ role: "concierge", text: `${foundCat.label}ですね。ご予算の目安をお選びください。` });

    } else if (state.step === "material_select") {
      const purpose = config.purposes.find(p => p.id === id);
      if (!purpose) return;
      state.selectedPurposeCategories = purpose.categories;
      state.step = "sub_category";
      messages.push({ role: "user", text: purpose.label });
      messages.push({ role: "concierge", text: `${purpose.label}に該当する詳細カテゴリをお選びください。` });

    } else if (state.step === "sub_category") {
      let foundCat = null;
      if (state.selectedPurposeCategories) {
        foundCat = state.selectedPurposeCategories.find(c => c.id === id);
      }
      if (!foundCat) return;
      state.selectedCategory = foundCat;
      state.step = "budget";
      messages.push({ role: "user", text: foundCat.label });
      messages.push({ role: "concierge", text: `${foundCat.label}ですね。ご予算の目安をお選びください。` });

    } else if (state.step === "budget_select" || state.step === "budget") {
      const budget = BUDGET_OPTIONS.find(b => b.id === id);
      if (!budget) return;
      state.selectedBudget = budget;
      state.step = "done";

      messages.push({ role: "user", text: budget.label });
      const matched = getMatchedProducts(state.selectedCategory, budget);
      messages.push({
        role: "concierge",
        text: matched.length > 0 ? `ご条件に合うおすすめの逸品を厳選いたしました。` : `条件に合う商品が見つかりませんでした。`,
        products: matched
      });
    }
    render();
  }

  function resetFlow() {
    state.step = "menu";
    state.selectedAction = null;
    state.selectedCategory = null;
    state.selectedType = null;
    state.selectedBudget = null;
    messages = [{ role: "concierge", text: config.greeting }];
    render();
  }

  // フローティングメニューのボタンイベント設定
  document.querySelectorAll(".nav-btn").forEach(btn => {
    btn.addEventListener("click", () => {
      handleNavClick(btn.dataset.action);
    });
  });

  document.getElementById("resetBtn").addEventListener("click", resetFlow);

  async function init() {
    await syncShopifyProducts();
    render();
  }
  init();
</script>
</body>
</html>
