<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light">
<title id="pageTitle">コンシェルジュ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=Zen+Kaku+Gothic+New:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --color-main: #6e5340;
    --color-main-deep: #2c221b;
    --color-bg: #f7f5f0;
    --color-surface: #ffffff;
    --color-text: #2b2520;
    --color-muted: #847970;
    --color-line: #e8e2d8;
    --color-accent: #9e7d5d;
    --color-user: #f0e9df;
    --radius: 14px;
    --shadow: 0 12px 32px rgba(43, 37, 32, 0.04);
    --font-serif: "Cormorant Garamond", "Times New Roman", serif;
    --font-sans: "Zen Kaku Gothic New", "Hiragino Sans", sans-serif;
  }

  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    color: var(--color-text);
    font-family: var(--font-sans);
    background: var(--color-bg);
    letter-spacing: 0.03em;
    -webkit-font-smoothing: antialiased;
  }

  button, input { font-family: inherit; color: inherit; }
  button { cursor: pointer; }

  .app {
    min-height: 100dvh;
    display: grid;
    grid-template-rows: auto 1fr auto auto auto;
    max-width: 960px;
    margin: 0 auto;
    padding: 32px 24px 20px;
  }

  .header {
    display: flex;
    justify-content: space-between;
    gap: 20px;
    align-items: flex-end;
    padding-bottom: 20px;
    border-bottom: 1px solid var(--color-line);
  }
  .brand-block { min-width: 0; }
  .eyebrow {
    margin: 0 0 6px;
    font-size: 11px;
    letter-spacing: 0.25em;
    text-transform: uppercase;
    color: var(--color-accent);
    font-weight: 500;
  }
  .brand-row { display: flex; align-items: center; gap: 12px; }
  .brand-logo { max-height: 48px; width: auto; object-fit: contain; }
  .brand {
    margin: 0;
    font-family: var(--font-serif);
    font-weight: 500;
    font-size: clamp(28px, 4vw, 40px);
    letter-spacing: 0.08em;
    line-height: 1;
  }
  
  .header-actions {
    display: flex;
    gap: 10px;
  }
  .btn-icon {
    border-radius: var(--radius);
    border: 1px solid var(--color-line);
    background: var(--color-surface);
    padding: 8px 14px;
    font-size: 12px;
    letter-spacing: 0.05em;
    display: inline-flex;
    align-items: center;
    gap: 6px;
    transition: all 0.2s ease;
    color: var(--color-text);
  }
  .btn-icon svg { width: 14px; height: 14px; fill: currentColor; }
  .btn-icon:hover { border-color: var(--color-accent); transform: translateY(-1px); }

  .thread {
    overflow-y: auto;
    padding: 32px 0 20px;
    display: flex;
    flex-direction: column;
    gap: 20px;
  }
  .bubble {
    max-width: min(640px, 100%);
    padding: 18px 22px;
    border-radius: var(--radius);
    line-height: 1.8;
    font-size: 14px;
    font-weight: 400;
  }
  .bubble.concierge {
    background: var(--color-surface);
    border: 1px solid var(--color-line);
    box-shadow: var(--shadow);
  }
  .bubble.user {
    align-self: flex-end;
    background: var(--color-user);
    border: 1px solid var(--color-line);
  }
  .who {
    display: block;
    margin-bottom: 6px;
    font-size: 10px;
    letter-spacing: 0.2em;
    color: var(--color-accent);
    text-transform: uppercase;
  }

  .choices { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; margin-top: 8px; }
  .choices.four { grid-template-columns: repeat(4, 1fr); }
  .choices:empty, .choices.hidden { display: none; }
  .choice {
    text-align: left;
    background: var(--color-surface);
    border: 1px solid var(--color-line);
    border-radius: var(--radius);
    padding: 18px 16px;
    box-shadow: var(--shadow);
    transition: all 0.2s ease;
  }
  .choice:hover { border-color: var(--color-accent); transform: translateY(-2px); }
  .choice strong { display: block; font-weight: 500; font-size: 15px; letter-spacing: 0.05em; }
  .choice span { display: block; margin-top: 6px; color: var(--color-muted); font-size: 11px; line-height: 1.5; }

  .products {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 16px;
  }
  .card {
    background: var(--color-surface);
    border: 1px solid var(--color-line);
    border-radius: var(--radius);
    overflow: hidden;
    box-shadow: var(--shadow);
    display: flex;
    flex-direction: column;
  }
  .card img {
    width: 100%;
    aspect-ratio: 1 / 1;
    object-fit: cover;
    background: #faf8f5;
  }
  .card-body { padding: 16px; display: flex; flex-direction: column; gap: 8px; flex: 1; }
  .card-cat { margin: 0; font-size: 10px; letter-spacing: 0.2em; color: var(--color-accent); text-transform: uppercase; }
  .card h3 { margin: 0; font-size: 15px; font-weight: 500; line-height: 1.4; }
  .price { margin: 0; font-size: 13px; font-weight: 500; color: var(--color-main-deep); }
  .product-link {
    margin-top: 12px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    text-decoration: none;
    background: var(--color-main);
    color: #fff;
    border-radius: 8px;
    padding: 10px 14px;
    font-size: 12px;
    letter-spacing: 0.08em;
    transition: background 0.2s;
  }
  .product-link svg { width: 12px; height: 12px; fill: currentColor; }
  .product-link:hover { opacity: 0.9; }

  .composer {
    display: grid;
    grid-template-columns: 1fr auto auto;
    gap: 10px;
    padding-top: 16px;
  }
  .composer input {
    border: 1px solid var(--color-line);
    background: var(--color-surface);
    border-radius: var(--radius);
    padding: 14px 18px;
    font-size: 14px;
    outline: none;
  }
  .composer input:focus { border-color: var(--color-accent); }
  
  .btn-submit {
    background: var(--color-main);
    color: #fff;
    border: none;
    border-radius: var(--radius);
    padding: 0 20px;
    display: inline-flex;
    align-items: center;
    gap: 6px;
    font-size: 13px;
  }
  .btn-submit svg { width: 14px; height: 14px; fill: currentColor; }

  .footer {
    margin-top: 24px;
    padding-top: 16px;
    border-top: 1px solid var(--color-line);
    display: flex;
    justify-content: space-between;
    font-size: 11px;
    color: var(--color-muted);
  }

  @media (max-width: 768px) {
    .app { padding: 20px 16px; }
    .choices, .choices.four, .products { grid-template-columns: 1fr; }
    .composer { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>
  <div class="app">
    <header class="header">
      <div class="brand-block">
        <p class="eyebrow" id="taglineLabel">革と対話するコンシェルジュ</p>
        <div class="brand-row" id="brandContainer">
          <h1 class="brand" id="brandNameLabel">DAYSART -Classic-</h1>
        </div>
      </div>
      <div class="header-actions">
        <button class="btn-icon" id="resetBtn" type="button">
          <svg viewBox="0 0 24 24"><path d="M17.65 6.35A7.958 7.958 0 0012 4c-4.42 0-7.99 3.58-7.99 8s3.57 8 7.99 8c3.73 0 6.84-2.55 7.73-6h-2.08A5.99 5.99 0 0112 18c-3.31 0-6-2.69-6-6s2.69-6 6-6c1.66 0 3.14.69 4.22 1.78L13 11h7V4l-2.35 2.35z"/></svg>
          最初から
        </button>
      </div>
    </header>

    <main class="thread" id="thread" aria-live="polite"></main>
    <div class="choices" id="choices"></div>

    <form class="composer" id="composer">
      <input id="answer" type="text" placeholder="選択肢を選ぶか、メッセージを入力..." autocomplete="off">
      <button class="btn-icon" id="micBtn" type="button">
        <svg viewBox="0 0 24 24"><path d="M12 14c1.66 0 3-1.34 3-3V5c0-1.66-1.34-3-3-3S9 3.34 9 5v6c0 1.66 1.34 3 3 3z"/><path d="M17 11c0 2.76-2.24 5-5 5s-5-2.24-5-5H5c0 3.53 2.61 6.43 6 6.92V21h2v-3.08c3.39-.49 6-3.39 6-6.92h-2z"/></svg>
        音声
      </button>
      <button class="btn-submit" type="submit">
        送信
        <svg viewBox="0 0 24 24"><path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/></svg>
      </button>
    </form>

    <footer class="footer">
      <span id="footerBrand">DAYSART -Classic-</span>
      <span>この対話はブラウザ内のみで安全に完了します。</span>
    </footer>
  </div>

<script>
  const customConfig = JSON.parse(localStorage.getItem("concierge_config") || "{}");
  
  const config = {
    brandName: customConfig.brandName || "DAYSART -Classic-",
    logoUrl: customConfig.logoUrl || "",
    tagline: customConfig.tagline || "革と対話するコンシェルジュ",
    greeting: customConfig.greeting || "ようこそ。革の表情から、今日の一品を一緒に見つけましょう。",
    mainColor: customConfig.mainColor || "#6e5340",
    shopifyDomain: customConfig.shopifyDomain || "https://daysart-classic.com"
  };

  // ロゴ設定の反映（画像URLがある場合は<img>、無ければテキスト）
  const brandContainer = document.getElementById("brandContainer");
  if (config.logoUrl) {
    brandContainer.innerHTML = `<img src="${config.logoUrl}" alt="${config.brandName}" class="brand-logo">`;
  } else {
    document.getElementById("brandNameLabel").textContent = config.brandName;
  }

  document.getElementById("pageTitle").textContent = config.brandName + " | コンシェルジュ";
  document.getElementById("taglineLabel").textContent = config.tagline;
  document.getElementById("footerBrand").textContent = config.brandName;
  document.documentElement.style.setProperty("--color-main", config.mainColor);

  let PRODUCTS = [];

  const CATEGORIES = [
    { id: "bag", label: "バッグ", hint: "トート、ブリーフ、ショルダー" },
    { id: "wallet", label: "財布・小物", hint: "コンパクト財布、カードケース、キーケース" }
  ];
  const STYLES = [
    { id: "classic", label: "クラシック", hint: "上品で、長く使う伝統デザイン" },
    { id: "stylish", label: "スタイリッシュ", hint: "都会的で洗練されたデザイン" }
  ];
  const BUDGETS = [
    { id: "under30", label: "〜3万円", hint: "税込 30,000円まで", max: 30000 },
    { id: "mid", label: "3〜8万円", hint: "税込 30,001〜80,000円", min: 30001, max: 80000 },
    { id: "high", label: "8万円〜", hint: "税込 80,001円から", min: 80001 }
  ];

  const CATEGORY_LABEL = Object.fromEntries(CATEGORIES.map((s) => [s.id, s.label]));

  let messages = [{ role: "concierge", text: config.greeting }];
  const state = { step: "category", category: null, style: null, budget: null };

  // Shopify商品の自動動的取得および価格の数値正規化
  async function syncShopifyProducts() {
    if (!config.shopifyDomain) return;
    try {
      const url = config.shopifyDomain.replace(/\/$/, '') + '/products.json';
      const res = await fetch(url);
      if (!res.ok) return;
      const data = await res.json();
      if (data.products && data.products.length > 0) {
        PRODUCTS = data.products.map(p => {
          const rawPrice = p.variants[0]?.price || "0";
          const numericPrice = Math.round(parseFloat(rawPrice));
          
          // タイトルや本文からカテゴリ/スタイルのキーワード判定
          const titleLower = p.title.toLowerCase();
          const isWallet = /ウォレット|財布|キーケース|カードケース|コイン/.test(titleLower);
          
          return {
            id: p.handle,
            name: p.title,
            category: isWallet ? "wallet" : "bag",
            styles: ["classic", "stylish"],
            price: numericPrice,
            url: `${config.shopifyDomain.replace(/\/$/, '')}/products/${p.handle}`,
            image: p.images[0]?.src || ""
          };
        });
      }
    } catch (e) {
      console.log("Shopify同期エラー", e);
    }
  }

  function render() {
    const thread = document.getElementById("thread");
    thread.innerHTML = messages.map(m => `
      <div class="bubble ${m.role}">
        <span class="who">${m.role === 'concierge' ? config.brandName : 'あなた'}</span>
        <div>${m.text}</div>
        ${m.products && m.products.length > 0 ? `
          <div class="products" style="margin-top:16px;">
            ${m.products.map(p => `
              <div class="card">
                <img src="${p.image}" alt="${p.name}">
                <div class="card-body">
                  <p class="card-cat">${CATEGORY_LABEL[p.category] || p.category}</p>
                  <h3>${p.name}</h3>
                  <p class="price">${p.price.toLocaleString()}円 税込</p>
                  <a class="product-link" href="${p.url}" target="_blank">
                    商品を見る
                    <svg viewBox="0 0 24 24"><path d="M19 19H5V5h7V3H5c-1.11 0-2 .9-2 2v14c0 1.1.89 2 2 2h14c1.1 0 2-.9 2-2v-7h-2v7zM14 3v2h3.59l-9.83 9.83 1.41 1.41L19 6.41V10h2V3h-7z"/></svg>
                  </a>
                </div>
              </div>
            `).join('')}
          </div>
        ` : ''}
      </div>
    `).join('');
    thread.scrollTop = thread.scrollHeight;

    const opts = currentOptions();
    const choicesEl = document.getElementById("choices");
    if (opts.length > 0 && state.step !== "done") {
      choicesEl.className = "choices";
      choicesEl.innerHTML = opts.map(o => `
        <button class="choice" type="button" data-id="${o.id}">
          <strong>${o.label}</strong>
          <span>${o.hint}</span>
        </button>
      `).join('');
      document.querySelectorAll(".choice").forEach(btn => {
        btn.addEventListener("click", () => handleSelect(btn.dataset.id));
      });
    } else {
      choicesEl.innerHTML = "";
      choicesEl.className = "choices hidden";
    }
  }

  function currentOptions() {
    if (state.step === "category") return CATEGORIES;
    if (state.step === "style") return STYLES;
    if (state.step === "budget") return BUDGETS;
    return [];
  }

  function handleSelect(id) {
    const opts = currentOptions();
    const selected = opts.find(o => o.id === id);
    if (!selected) return;

    messages.push({ role: "user", text: selected.label });

    if (state.step === "category") {
      state.category = id;
      state.step = "style";
      messages.push({ role: "concierge", text: CATEGORY_LABEL[id] + "ですね。お好みのデザインをお選びください。" });
    } else if (state.step === "style") {
      state.style = id;
      state.step = "budget";
      messages.push({ role: "concierge", text: "ご予算の目安をお選びください。厳格に条件判定いたします。" });
    } else if (state.step === "budget") {
      state.budget = id;
      state.step = "done";
      
      const budgetObj = BUDGETS.find(b => b.id === id);
      
      // 厳格な価格フィルタリング処理（文字と数値を正しく比較）
      const matched = PRODUCTS.filter(p => {
        if (p.category !== state.category) return false;
        if (budgetObj.min && p.price < budgetObj.min) return false;
        if (budgetObj.max && p.price > budgetObj.max) return false;
        return true;
      });

      const count = matched.length;
      messages.push({
        role: "concierge",
        text: count > 0 
          ? `ご条件（${selected.label}）に一致する商品を ${count} 点ご用意いたしました。`
          : `申し訳ありません。ご条件（${selected.label}）にぴったり合う商品が見つかりませんでした。別の条件でお試しください。`,
        products: matched
      });
    }
    render();
  }

  document.getElementById("resetBtn").addEventListener("click", () => {
    state.step = "category";
    state.category = null;
    state.style = null;
    state.budget = null;
    messages = [{ role: "concierge", text: config.greeting }];
    render();
  });

  async function init() {
    await syncShopifyProducts();
    render();
  }
  init();
</script>
</body>
</html>
