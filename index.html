<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light">
<title id="pageTitle">コンシェルジュ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --color-main: #6e5340;
    --color-main-deep: #3f2e24;
    --color-bg: #f3eee7;
    --color-surface: #fbf8f4;
    --color-text: #2b241f;
    --color-muted: #75685c;
    --color-line: #e4d7c8;
    --color-accent: #8d6a45;
    --color-chip: #f3e7d8;
    --color-on-main: #fbf8f4;
    --color-user: #efe4d6;
    --radius: 18px;
    --shadow: 0 18px 40px rgba(63, 46, 36, 0.08);
    --font-serif: "Cormorant Garamond", "Times New Roman", serif;
    --font-sans: "Zen Kaku Gothic New", "Hiragino Sans", "Yu Gothic", sans-serif;
  }

  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    color: var(--color-text);
    font-family: var(--font-sans);
    background:
      radial-gradient(1200px 500px at 10% -10%, color-mix(in srgb, var(--color-accent) 18%, transparent), transparent 60%),
      radial-gradient(900px 420px at 110% 0%, color-mix(in srgb, var(--color-main) 14%, transparent), transparent 55%),
      var(--color-bg);
    letter-spacing: 0.01em;
  }

  button, input, textarea { font-family: inherit; color: inherit; }
  button { cursor: pointer; }
  :focus-visible {
    outline: 2px solid var(--color-accent);
    outline-offset: 2px;
  }

  .app {
    min-height: 100dvh;
    display: grid;
    grid-template-rows: auto 1fr auto auto auto;
    max-width: 1080px;
    margin: 0 auto;
    padding: 20px 20px 12px;
  }

  .header {
    display: flex;
    justify-content: space-between;
    gap: 16px;
    align-items: flex-end;
    padding-bottom: 14px;
    border-bottom: 1px solid var(--color-line);
  }
  .brand-block { min-width: 0; }
  .eyebrow {
    margin: 0 0 4px;
    font-size: 11px;
    letter-spacing: 0.22em;
    text-transform: uppercase;
    color: var(--color-accent);
  }
  .brand-row { display: flex; align-items: center; gap: 10px; }
  .brand {
    margin: 0;
    font-family: var(--font-serif);
    font-weight: 500;
    font-size: clamp(32px, 4vw, 44px);
    letter-spacing: 0.08em;
    line-height: 1;
  }
  .speak-dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: var(--color-accent);
    opacity: 0.35;
  }
  body.is-speaking .speak-dot {
    opacity: 1;
    animation: pulse 1s ease-in-out infinite;
  }
  @keyframes pulse {
    50% { transform: scale(1.45); opacity: 0.55; }
  }
  .tagline {
    margin: 8px 0 0;
    color: var(--color-muted);
    font-size: 13px;
  }
  .header-actions {
    display: flex;
    flex-wrap: wrap;
    justify-content: flex-end;
    gap: 8px;
  }
  .ghost, .solid, .mic, .send {
    border-radius: calc(var(--radius) - 6px);
    border: 1px solid var(--color-line);
    background: var(--color-surface);
    padding: 10px 14px;
    font-size: 13px;
    letter-spacing: 0.04em;
    transition: background 0.2s, border-color 0.2s, transform 0.2s;
  }
  .ghost[aria-pressed="true"] {
    background: var(--color-main);
    color: var(--color-on-main);
    border-color: var(--color-main);
  }
  .solid {
    background: var(--color-main);
    color: var(--color-on-main);
    border-color: var(--color-main);
  }
  .ghost:hover, .solid:hover, .mic:hover, .send:hover { transform: translateY(-1px); }

  .thread {
    overflow: auto;
    padding: 22px 2px 12px;
    display: flex;
    flex-direction: column;
    gap: 14px;
    scroll-behavior: smooth;
  }
  .bubble {
    max-width: min(680px, 100%);
    padding: 14px 16px;
    border-radius: var(--radius);
    line-height: 1.75;
    font-size: 15px;
  }
  .bubble.concierge {
    background: var(--color-surface);
    border: 1px solid var(--color-line);
    box-shadow: var(--shadow);
  }
  .bubble.user {
    align-self: flex-end;
    background: var(--color-user);
    border: 1px solid var(--color-line);
  }
  .who {
    display: block;
    margin-bottom: 4px;
    font-size: 11px;
    letter-spacing: 0.16em;
    color: var(--color-accent);
  }

  .choices { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
  .choices.four { grid-template-columns: repeat(4, 1fr); }
  .choices:empty, .choices.hidden { display: none; }
  .choice {
    text-align: left;
    background: var(--color-surface);
    border: 1px solid var(--color-line);
    border-radius: var(--radius);
    padding: 14px 14px 12px;
    box-shadow: var(--shadow);
  }
  .choice:hover { border-color: var(--color-accent); }
  .choice strong { display: block; font-weight: 500; font-size: 16px; letter-spacing: 0.06em; }
  .choice span { display: block; margin-top: 4px; color: var(--color-muted); font-size: 12px; line-height: 1.5; }

  .products {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 12px;
  }
  .card {
    background: var(--color-surface);
    border: 1px solid var(--color-line);
    border-radius: var(--radius);
    overflow: hidden;
    box-shadow: var(--shadow);
    display: flex;
    flex-direction: column;
  }
  .card img {
    width: 100%;
    aspect-ratio: 4 / 3;
    object-fit: cover;
    background: var(--color-chip);
    display: block;
  }
  .card-body { padding: 12px 12px 14px; display: flex; flex-direction: column; gap: 8px; flex: 1; }
  .card-cat { margin: 0; font-size: 11px; letter-spacing: 0.14em; color: var(--color-accent); }
  .card h3 { margin: 0; font-family: var(--font-serif); font-size: 26px; font-weight: 500; letter-spacing: 0.03em; }
  .price { margin: 0; font-size: 14px; }
  .tags { display: flex; flex-wrap: wrap; gap: 6px; margin: 0; padding: 0; list-style: none; }
  .tags li {
    font-size: 11px;
    letter-spacing: 0.04em;
    padding: 4px 8px;
    border-radius: 999px;
    background: var(--color-chip);
  }
  .badge {
    align-self: flex-start;
    font-size: 11px;
    letter-spacing: 0.08em;
    color: var(--color-main-deep);
  }
  .product-link {
    margin-top: auto;
    display: inline-flex;
    justify-content: center;
    text-decoration: none;
    background: var(--color-main);
    color: var(--color-on-main);
    border-radius: calc(var(--radius) - 8px);
    padding: 10px 12px;
    font-size: 13px;
    letter-spacing: 0.08em;
  }
  .product-link:hover { filter: brightness(1.08); }

  .composer {
    display: grid;
    grid-template-columns: 1fr auto auto;
    gap: 8px;
    padding-top: 10px;
  }
  .composer input {
    border: 1px solid var(--color-line);
    background: var(--color-surface);
    border-radius: calc(var(--radius) - 4px);
    padding: 12px 14px;
    font-size: 15px;
  }
  .mic.listening {
    background: var(--color-main);
    color: var(--color-on-main);
    border-color: var(--color-main);
  }
  .hint {
    grid-column: 1 / -1;
    margin: 0;
    min-height: 1.2em;
    font-size: 12px;
    color: var(--color-muted);
  }

  .footer {
    margin-top: 8px;
    padding-top: 10px;
    border-top: 1px solid var(--color-line);
    display: flex;
    justify-content: space-between;
    gap: 12px;
    flex-wrap: wrap;
    font-size: 12px;
    color: var(--color-muted);
  }
  .footer strong { color: var(--color-main-deep); font-weight: 500; }

  @media (max-width: 800px) {
    .app { padding: 14px 12px 8px; }
    .header { flex-direction: column; align-items: stretch; }
    .header-actions { justify-content: flex-start; }
    .choices, .choices.four, .products, .composer {
      grid-template-columns: 1fr;
    }
    .composer { grid-template-columns: 1fr 1fr; }
    .composer input { grid-column: 1 / -1; }
    .card h3 { font-size: 22px; }
  }
</style>
</head>
<body>
  <div class="app">
    <header class="header">
      <div class="brand-block">
        <p class="eyebrow" id="taglineLabel">革と対話するコンシェルジュ</p>
        <div class="brand-row">
          <h1 class="brand" id="brandNameLabel">ATELIER CUIR</h1>
          <span class="speak-dot" id="speakDot" aria-hidden="true"></span>
        </div>
      </div>
      <div class="header-actions">
        <button class="ghost" id="voiceToggle" type="button" aria-pressed="true">音声ガイド: ON</button>
        <button class="solid" id="resetBtn" type="button">最初からやり直す</button>
      </div>
    </header>

    <main class="thread" id="thread" aria-live="polite"></main>
    <div class="choices" id="choices"></div>

    <form class="composer" id="composer">
      <input id="answer" type="text" placeholder="選ぶか、文字で答えてください" autocomplete="off" aria-label="回答">
      <button class="mic" id="micBtn" type="button">🎙️ 声で答える</button>
      <button class="send" type="submit">送信</button>
      <p class="hint" id="hint"></p>
    </form>

    <footer class="footer">
      <span id="footerBrand">ATELIER CUIR</span>
      <span><strong>個人情報の入力はお控えください。</strong> この対話はお使いのブラウザの中だけで完結します。</span>
    </footer>
  </div>

<script>
  // ローカルストレージまたはデフォルト設定の読み込み
  const customConfig = JSON.parse(localStorage.getItem("concierge_config") || "{}");
  
  const config = {
    brandName: customConfig.brandName || "ATELIER CUIR",
    tagline: customConfig.tagline || "革と対話するコンシェルジュ",
    greeting: customConfig.greeting || "ようこそ。革の表情から、今日の一品を一緒に見つけましょう。まずはご覧になりたいものをお選びください。",
    mainColor: customConfig.mainColor || "#6e5340",
    shopifyDomain: customConfig.shopifyDomain || "",
    shopifyToken: customConfig.shopifyToken || ""
  };

  // 画面への適用
  document.getElementById("pageTitle").textContent = config.brandName + " | コンシェルジュ";
  document.getElementById("brandNameLabel").textContent = config.brandName;
  document.getElementById("taglineLabel").textContent = config.tagline;
  document.getElementById("footerBrand").textContent = config.brandName;
  document.documentElement.style.setProperty("--color-main", config.mainColor);

  // 標準商品データ（Shopify未連携時のフォールバック）
  let PRODUCTS = [
    { id: "heritage-tote", name: "ヘリテージ トート", category: "bag", styles: ["classic"], price: 78000, url: "#", image: "https://images.unsplash.com/photo-1548036328-c9fa89d128fa?auto=format&fit=crop&w=900&q=80", copy: "型崩れしにくいコバと、年月で艶の増す植物タンニンなめし。" },
    { id: "compact-hand", name: "コンパクト ハンド", category: "bag", styles: ["classic"], price: 24800, url: "#", image: "https://images.unsplash.com/photo-1584917865442-de89df76afd3?auto=format&fit=crop&w=900&q=80", copy: "式典から日常まで持てる、小さなクラシック。" },
    { id: "nocturne-long", name: "長札入れ ノクターン", category: "wallet", styles: ["classic"], price: 36000, url: "#", image: "https://images.unsplash.com/photo-1627123424574-724758594e93?auto=format&fit=crop&w=900&q=80", copy: "札が落ち着くまで待つ、やや深めのマチ。" },
    { id: "sharp-card", name: "シャープ カードケース", category: "wallet", styles: ["stylish"], price: 16800, url: "#", image: "https://images.unsplash.com/photo-1612902456551-333ac5afa26e?auto=format&fit=crop&w=900&q=80", copy: "カードが扇状に開く、薄いケース。" },
    { id: "daily-coin", name: "デイリー コインケース", category: "wallet", styles: ["casual"], price: 12000, url: "#", image: "https://images.unsplash.com/photo-1612902456551-333ac5afa26e?auto=format&fit=crop&w=700&q=60", copy: "片手で開く口金。小さな贈り物に向きます。" }
  ];

  const CATEGORIES = [
    { id: "bag", label: "バッグ", hint: "トート、ショルダー、ブリーフ" },
    { id: "wallet", label: "財布・小物", hint: "財布、カード、キーケース" },
    { id: "gift", label: "ギフト", hint: "包装とギフト向けの一品" }
  ];
  const STYLES = [
    { id: "classic", label: "クラシック", hint: "上品で、長く使う" },
    { id: "stylish", label: "スタイリッシュ", hint: "都会的でシャープ" },
    { id: "casual", label: "カジュアル", hint: "日常にやわらかく" },
    { id: "minimal", label: "ミニマル", hint: "線の少ない佇まい" }
  ];
  const BUDGETS = [
    { id: "under30", label: "〜3万円", hint: "税込 30,000円まで", max: 30000 },
    { id: "mid", label: "3〜8万円", hint: "税込 30,001〜80,000円", min: 30001, max: 80000 },
    { id: "high", label: "8万円〜", hint: "税込 80,001円から", min: 80001 }
  ];

  const STYLE_LABEL = Object.fromEntries(STYLES.map((s) => [s.id, s.label]));
  const CATEGORY_LABEL = Object.fromEntries(CATEGORIES.map((s) => [s.id, s.label]));

  let messages = [{ role: "concierge", text: config.greeting }];
  const state = { step: "category", category: null, style: null, budget: null, voice: true };

  // Shopify API連携の自動同期処理（設定がある場合）
  async function syncShopifyProducts() {
    if (!config.shopifyDomain) return;
    try {
      // Shopify公開JSONエンドポイントからの取得例
      const res = await fetch(`${config.shopifyDomain}/products.json`);
      if (!res.ok) return;
      const data = await res.json();
      if (data.products && data.products.length > 0) {
        PRODUCTS = data.products.map(p => ({
          id: p.handle,
          name: p.title,
          category: "bag", // 必要に応じてタグ等で振り分け
          styles: ["classic"],
          price: parseInt(p.variants[0]?.price || 0, 10),
          url: `${config.shopifyDomain}/products/${p.handle}`,
          image: p.images[0]?.src || "",
          copy: p.body_html ? p.body_html.replace(/<[^>]*>?/gm, '').substring(0, 50) + "..." : ""
        }));
      }
    } catch (e) {
      console.log("Shopify同期スキップ（標準データを使用します）", e);
    }
  }

  function render() {
    const thread = document.getElementById("thread");
    thread.innerHTML = messages.map(m => `
      <div class="bubble ${m.role}">
        <span class="who">${m.role === 'concierge' ? config.brandName : 'あなた'}</span>
        <div>${m.text}</div>
        ${m.products ? `
          <div class="products" style="margin-top:12px;">
            ${m.products.map(p => `
              <div class="card">
                <img src="${p.image}" alt="${p.name}">
                <div class="card-body">
                  <p class="card-cat">${CATEGORY_LABEL[p.category] || p.category}</p>
                  <h3>${p.name}</h3>
                  <p class="price">${p.price.toLocaleString()}円 税込</p>
                  <p style="font-size:13px; color:var(--color-muted);">${p.copy}</p>
                  <a class="product-link" href="${p.url}" target="_blank">商品ページへ</a>
                </div>
              </div>
            `).join('')}
          </div>
        ` : ''}
      </div>
    `).join('');
    thread.scrollTop = thread.scrollHeight;

    const opts = currentOptions();
    const choicesEl = document.getElementById("choices");
    if (opts.length > 0 && state.step !== "done") {
      choicesEl.className = opts.length === 4 ? "choices four" : "choices";
      choicesEl.innerHTML = opts.map(o => `
        <button class="choice" type="button" data-id="${o.id}">
          <strong>${o.label}</strong>
          <span>${o.hint}</span>
        </button>
      `).join('');
      document.querySelectorAll(".choice").forEach(btn => {
        btn.addEventListener("click", () => handleSelect(btn.dataset.id));
      });
    } else {
      choicesEl.innerHTML = "";
      choicesEl.className = "choices hidden";
    }
  }

  function currentOptions() {
    if (state.step === "category") return CATEGORIES;
    if (state.step === "style") return STYLES;
    if (state.step === "budget") return BUDGETS;
    return [];
  }

  function handleSelect(id) {
    const opts = currentOptions();
    const selected = opts.find(o => o.id === id);
    if (!selected) return;

    messages.push({ role: "user", text: selected.label });

    if (state.step === "category") {
      state.category = id;
      state.step = "style";
      messages.push({ role: "concierge", text: CATEGORY_LABEL[id] + "ですね。お好みのデザインを教えてください。" });
    } else if (state.step === "style") {
      state.style = id;
      state.step = "budget";
      messages.push({ role: "concierge", text: "かしこまりました。ご予算の目安を教えてください。税込で厳格に絞り込みます。" });
    } else if (state.step === "budget") {
      state.budget = id;
      state.step = "done";
      
      const budgetObj = BUDGETS.find(b => b.id === id);
      const matched = PRODUCTS.filter(p => {
        if (p.category !== state.category) return false;
        if (!p.styles.includes(state.style)) return false;
        if (budgetObj.min && p.price < budgetObj.min) return false;
        if (budgetObj.max && p.price > budgetObj.max) return false;
        return true;
      });

      messages.push({
        role: "concierge",
        text: `ご条件に合う商品を ${matched.length} 点ご用意しました。`,
        products: matched.length > 0 ? matched : PRODUCTS.slice(0, 3)
      });
    }
    render();
  }

  document.getElementById("resetBtn").addEventListener("click", () => {
    state.step = "category";
    state.category = null;
    state.style = null;
    state.budget = null;
    messages = [{ role: "concierge", text: config.greeting }];
    render();
  });

  document.getElementById("voiceToggle").addEventListener("click", () => {
    state.voice = !state.voice;
    document.getElementById("voiceToggle").setAttribute("aria-pressed", state.voice ? "true" : "false");
    document.getElementById("voiceToggle").textContent = state.voice ? "音声ガイド: ON" : "音声ガイド: OFF";
  });

  document.getElementById("composer").addEventListener("submit", (e) => {
    e.preventDefault();
    const val = document.getElementById("answer").value.trim();
    if (!val) return;
    document.getElementById("answer").value = "";
    messages.push({ role: "user", text: val });
    messages.push({ role: "concierge", text: "自由入力での検索は、上の選択肢から進めていただくか、「最初からやり直す」をお試しください。" });
    render();
  });

  // 初期化実行
  async function init() {
    await syncShopifyProducts();
    render();
  }
  init();
</script>
</body>
</html>
